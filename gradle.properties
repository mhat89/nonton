# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects.
org.gradle.parallel=true

# Configure Gradle to use configuration caching for faster builds
org.gradle.configuration-cache=true

# Kotlin settings
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.compiler=true
kotlin.incremental.useClasspathSnapshot=true

# Android settings
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# Build cache
android.buildCache=true

# R8
android.enableR8.fullMode=true

# Jetpack Compose
android.compose.compiler.version=1.5.8

# Versions
agpVersion=8.6.0
kotlinVersion=1.9.22
kspVersion=1.9.22-1.0.17
composeBomVersion=2024.02.00
exoplayerVersion=2.19.1
coilVersion=2.6.0
hiltVersion=2.48
roomVersion=2.6.1
navigationVersion=2.7.6
lifecycleVersion=2.8.0
pagingVersion=3.2.1
workVersion=2.9.0
okhttpVersion=4.12.0
retrofitVersion=2.11.0
moshiVersion=1.15.1
coroutinesVersion=1.7.3
serializationVersion=1.6.3
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
